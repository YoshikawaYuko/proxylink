<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12142e">
<title>分流星图 · 代理策略可视化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&text=%E5%88%86%E6%B5%81%E6%98%9F%E5%9B%BE&display=swap">
<style>
@font-face{
  font-family:"Flag Emoji";
  src:url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.8/dist/TwemojiCountryFlags.woff2") format("woff2");
  unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E0063,U+E0065,U+E0067,U+E006C,U+E006E,U+E0073-E0074,U+E0077,U+E007F;
  font-display:swap;
}
:root{
  color-scheme:dark;
  --night:#12142e;
  --glass:rgba(29,32,78,.6);
  --hair:rgba(170,178,255,.14);
  --star:#eef0ff;
  --dim:#a8add6;
  --faint:#7a80b2;
  --gp:#5aa9ff;
  --pure:#4fe0a2;
  --res:#ffbf5e;
  --bak:#b690ff;
  --direct:#dfe6f6;
  --reject:#ff5c76;
  --flag:"Sora";
  --sans:var(--flag),"Sora","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong",serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html.win{--flag:"Flag Emoji"}
*{box-sizing:border-box}
html{background:var(--night);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--star);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #cfd6ff;outline-offset:2px}

/* ---------- 夜空 ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.aura{position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
    radial-gradient(1100px 680px at 88% -12%,rgba(90,169,255,.17),transparent 62%),
    radial-gradient(820px 620px at -12% 34%,rgba(182,144,255,.13),transparent 62%),
    radial-gradient(900px 700px at 58% 112%,rgba(79,224,162,.08),transparent 62%),
    linear-gradient(180deg,#15183c 0%,#101232 48%,#0c0e28 100%);}

/* ---------- 头部 ---------- */
.hero{max-width:1320px;margin:0 auto;padding:60px 40px 26px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:end}
h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(66px,9.6vw,138px);line-height:.98;letter-spacing:.05em;
  background:linear-gradient(176deg,#ffffff 18%,#c4c9f4 62%,#8f97d8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(120,140,255,.3))}
.lede{margin:20px 0 0;max-width:31em;color:var(--dim);font-size:15px;line-height:1.85}
.legend{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--dim)}
.legend li{display:flex;align-items:center;gap:7px}
.legend li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}

.now{position:relative;padding:20px 22px 22px;border-radius:26px;background:linear-gradient(160deg,rgba(44,48,108,.6),rgba(24,27,66,.5));border:1px solid var(--hair);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.now-h{margin:0 0 14px;font-size:13px;font-weight:500;color:var(--dim)}
.now-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.now-k{display:block;font-size:12px;color:var(--faint);margin-bottom:5px}
.now-v{display:flex;align-items:center;gap:9px;min-width:0}
.now-v i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);transition:background .45s,box-shadow .45s}
.now-v b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 舞台 ---------- */
.stage{position:relative;max-width:1320px;margin:0 auto;padding:16px 40px 170px;display:grid;
  grid-template-columns:minmax(200px,250px) minmax(320px,400px) minmax(210px,250px);justify-content:space-between;align-items:start}
.layer{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#wires,#sparks{z-index:0}
#ports{z-index:2}
.col{position:relative;z-index:1;min-width:0}
.col-h{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;padding-left:6px;font-size:13px;font-weight:500;color:var(--dim)}
.col-h small{font-size:12px;font-weight:400;color:var(--faint)}
.col-h .reset{margin-left:auto;appearance:none;border:1px solid var(--hair);background:rgba(255,255,255,.04);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--dim);cursor:pointer;transition:opacity .3s,background .2s}
.col-h .reset:hover{background:rgba(255,255,255,.09)}
.col-h .reset:disabled{opacity:.35;cursor:default}
.only-lanes{display:none}

/* 连线 */
.w-glow{fill:none;stroke-width:7;stroke-linecap:round;opacity:.15;transition:opacity .35s}
.w-core{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.88;transition:opacity .35s,stroke-width .35s}
.w-flow{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1 13;opacity:0;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.stage.focusing .w-glow.dim{opacity:.025}
.stage.focusing .w-core.dim{opacity:.1}
.stage.focusing .w-glow.hot{opacity:.34}
.stage.focusing .w-core.hot{opacity:1;stroke-width:2.3}
.port{transition:opacity .35s}
.stage.focusing .port.dim{opacity:.15}

/* 网站 */
.sec-h{margin:22px 0 4px;padding-left:8px;font-size:12px;font-weight:500;color:var(--faint)}
.site{appearance:none;border:0;background:transparent;text-align:left;width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) 12px;align-items:center;gap:10px;padding:6px 2px 6px 6px;border-radius:13px;cursor:pointer;transition:background .25s,opacity .35s}
.site:hover,.site.hot{background:rgba(255,255,255,.05)}
.stage.focusing .site:not(.hot){opacity:.36}
.s-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;line-height:1;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.s-text{min-width:0}
.s-name{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-exit{display:block;font-size:11.5px;color:var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .45s}
.s-star{justify-self:end;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.06),0 0 12px var(--c)}
.lane,.lane-exit{display:none}

/* 策略组 */
.station{position:relative;margin:14px 0 18px;padding:14px;border-radius:22px;background:var(--glass);
  -webkit-backdrop-filter:blur(12px) saturate(1.25);backdrop-filter:blur(12px) saturate(1.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 60px -36px var(--c);transition:opacity .45s,filter .45s,box-shadow .45s}
.station::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,var(--c),rgba(255,255,255,.06) 42%,rgba(255,255,255,.04) 70%,var(--c));opacity:.55;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.station.idle{opacity:.5;filter:saturate(.5)}
.station.lit{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px var(--c),0 26px 70px -30px var(--c)}
.st-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.st-emoji{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;line-height:1;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--c),0 0 24px -8px var(--c)}
.st-titles{min-width:0;flex:1}
.st-name{margin:0;font-size:15.5px;font-weight:600;line-height:1.3}
.st-desc{margin:2px 0 0;font-size:12px;color:var(--dim)}
.st-badge{flex:none;align-self:flex-start;font-size:11.5px;color:var(--c);padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);white-space:nowrap}
.station.idle .st-badge{color:var(--faint)}
.st-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{appearance:none;position:relative;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:40px;padding:8px 10px 8px 25px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);transition:background .25s,border-color .25s,box-shadow .25s,transform .15s}
.opt::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);transition:background .25s,border-color .25s,box-shadow .25s}
.opt:hover{background:rgba(255,255,255,.075)}
.opt:active{transform:scale(.97)}
.opt[aria-checked="true"]{background:rgba(255,255,255,.1);border-color:var(--c);box-shadow:0 0 24px -8px var(--c),inset 0 0 18px -10px var(--c)}
.opt[aria-checked="true"]::before{background:var(--c);border-color:var(--c);box-shadow:0 0 10px var(--c)}
.o-label{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-idle{margin:10px 2px 0;font-size:11.5px;color:var(--faint);visibility:hidden}
.station.idle .st-idle{visibility:visible}

/* 出口 */
.exits{align-self:stretch}
.exit{position:absolute;left:0;right:0;display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:14px;cursor:default;transition:top .7s cubic-bezier(.65,0,.35,1),opacity .45s,filter .45s}
.exit.idle{opacity:.42;filter:saturate(.4)}
.x-ring{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(22,25,64,.95) 68%);box-shadow:0 0 0 1.5px var(--c),0 0 30px -4px var(--c);transition:box-shadow .45s}
.x-ring::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--c);opacity:.3}
.exit.ping .x-ring::after{animation:ping .9s ease-out}
@keyframes ping{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.exit.lit .x-ring{box-shadow:0 0 0 2px var(--c),0 0 44px -2px var(--c)}
.x-title{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-cap{display:block;font-size:11.5px;color:var(--dim)}
.x-count{display:block;margin-top:2px;font-size:11.5px;color:var(--c)}

/* 底部路线条 */
.routebar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:min(880px,calc(100% - 20px));min-height:56px;padding:12px 16px;border-radius:20px;
  background:rgba(22,25,62,.84);border:1px solid var(--hair);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 20px 60px -20px rgba(0,0,0,.7);display:flex;align-items:center;gap:12px}
.rb-body{flex:1;min-width:0}
.rb-idle{margin:0;color:var(--dim);font-size:13px}
.rb-line{margin:0 0 7px;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-line b{color:var(--star);font-weight:600}
.rb-chain{display:flex;flex-wrap:wrap;align-items:center;row-gap:6px}
.rb-node{display:inline-flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--c)}
.rb-node small{font-size:11px;color:var(--dim);font-weight:400}
.rb-node.end{background:var(--c);color:#12142e;box-shadow:0 0 18px -4px var(--c)}
.rb-link{width:20px;height:2px;flex:none;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 8px var(--b)}
.rb-list{margin:0;font-size:12.5px;color:var(--star);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rb-close{flex:none;appearance:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);background:rgba(255,255,255,.05);color:var(--dim);font-size:16px;line-height:1;cursor:pointer}
.rb-close:hover{background:rgba(255,255,255,.1)}
.only-touch{display:none}
@media (hover:none){.only-touch{display:inline}.only-mouse{display:none}}

#probe-svg{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}

@media (min-width:1080px) and (max-width:1279.98px){
  .hero{padding-left:28px;padding-right:28px}
  .stage{grid-template-columns:200px 360px 200px;padding-left:28px;padding-right:28px}
}
/* ---------- 窄屏：线路列表 ---------- */
@media (max-width:1079.98px){
  .hero{grid-template-columns:1fr;gap:24px;padding:38px 18px 14px;max-width:720px}
  h1{font-size:clamp(58px,17vw,96px)}
  .lede{font-size:14.5px;margin-top:14px}
  .now{padding:16px 18px 18px;border-radius:22px}
  .now-v b{font-size:14.5px}
  .stage{grid-template-columns:minmax(0,1fr);max-width:720px;padding:6px 18px 190px}
  .stations{order:1;padding-right:26px}
  .sites{order:2;margin-top:10px}
  .exits{display:none}
  #sparks{display:none}
  .w-flow{opacity:.9}
  .only-graph{display:none}
  .only-lanes{display:inline}
  .station{margin:12px 0 14px}
  .st-opts{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
  .site{grid-template-columns:28px minmax(60px,6.9em) minmax(34px,1fr) auto;gap:8px;padding:8px 4px 8px 6px}
  .s-icon{width:28px;height:28px;font-size:15px}
  .s-name{font-size:13.5px;white-space:normal;line-height:1.3}
  .s-star,.s-exit{display:none}
  .lane{display:flex;position:relative;height:24px;align-items:center;min-width:0}
  .lane-exit{display:block;justify-self:end;max-width:12em;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:500;color:var(--ec);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .45s,box-shadow .45s}
  .rb-line{white-space:normal}
}
@media (max-width:560px){
  .station[data-g="res"] .st-opts{grid-template-columns:1fr}
  .station[data-g="res"] .opt{min-height:36px;padding-top:6px;padding-bottom:6px}
}
@media (max-width:380px){
  .site{grid-template-columns:minmax(56px,6.4em) minmax(30px,1fr) auto}
  .s-icon{display:none}
}
.lane-wire{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:var(--ec);box-shadow:0 0 10px -2px var(--ec)}
.spark-track{position:absolute;left:0;top:0;width:100%;height:100%;animation:lane-flow var(--dur,2.8s) linear infinite;animation-delay:var(--delay,0s)}
.spark-track::after{content:"";position:absolute;right:-3px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--ec),0 0 16px 3px var(--ec)}
@keyframes lane-flow{0%{transform:translateX(-100%);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(0);opacity:0}}
.lane-stops{position:relative;display:flex;justify-content:space-evenly;align-items:center;width:100%}
.site.is-reject .lane-stops{justify-content:flex-end}
.stop{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:400;line-height:1;background:#191c46;box-shadow:0 0 0 1.5px var(--c),0 0 12px -2px var(--c);animation:stop-in .55s cubic-bezier(.2,.9,.3,1.35) both}
@keyframes stop-in{from{transform:scale(.2);opacity:0}}
.site.is-reject .lane-wire{background:repeating-linear-gradient(90deg,var(--ec) 0 6px,transparent 6px 11px);box-shadow:none}
.site.is-reject .spark-track{animation-name:lane-block}
@keyframes lane-block{0%{transform:translateX(-100%);opacity:0}10%{opacity:1}72%{transform:translateX(-16%);opacity:1}80%{transform:translateX(-14%);opacity:0}100%{transform:translateX(-14%);opacity:0}}
.site.flash .lane-wire{animation:wire-flash 1s ease-out}
@keyframes wire-flash{0%{filter:brightness(2.6);box-shadow:0 0 18px 3px var(--ec)}100%{filter:none}}

@media (prefers-reduced-motion:reduce){
  .spark-track,.w-flow{display:none}
  .exit,.station,.site,.now-v i{transition:none}
  .stop,.site.flash .lane-wire,.exit.ping .x-ring::after{animation:none}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="aura" aria-hidden="true"></div>

<header class="hero">
  <div>
    <h1>分流星图</h1>
    <p class="lede">每个网站的流量最后从哪里出去，这张图一眼就能看懂。点选策略组里的选项，连线会立刻改道。</p>
    <ul class="legend" aria-label="颜色说明">
      <li style="--c:var(--gp)">通用代理</li>
      <li style="--c:var(--pure)">纯净保护</li>
      <li style="--c:var(--res)">住宅 IP</li>
      <li style="--c:var(--bak)">备用节点</li>
      <li style="--c:var(--direct)">不走代理</li>
      <li style="--c:var(--reject)">阻断连接</li>
    </ul>
  </div>
  <section class="now" aria-label="此刻的去向">
    <h2 class="now-h">此刻</h2>
    <div class="now-grid">
      <div data-now="pure"><span class="now-k">AI 与 TikTok</span><span class="now-v"><i></i><b></b></span></div>
      <div data-now="gp"><span class="now-k">海外网站</span><span class="now-v"><i></i><b></b></span></div>
      <div data-now="direct"><span class="now-k">国内网站</span><span class="now-v"><i></i><b></b></span></div>
      <div data-now="reject"><span class="now-k">Adobe 监测</span><span class="now-v"><i></i><b></b></span></div>
    </div>
  </section>
</header>

<main class="stage" id="stage">
  <svg class="layer" id="wires" aria-hidden="true"><defs></defs><g class="glows"></g><g class="cores"></g><g class="flows"></g></svg>
  <canvas class="layer" id="sparks" aria-hidden="true"></canvas>

  <section class="col sites" id="sites" aria-label="网站">
    <h2 class="col-h"><span class="only-graph">网站</span><span class="only-lanes">各网站的去向</span><small class="only-lanes">点一下看完整路线</small></h2>
  </section>

  <section class="col stations" id="stations" aria-label="策略组">
    <h2 class="col-h">策略组<small>点选即可切换</small><button type="button" class="reset" id="reset">恢复默认</button></h2>
  </section>

  <section class="col exits" id="exits" aria-label="出口">
    <h2 class="col-h">出口</h2>
  </section>

  <svg class="layer" id="ports" aria-hidden="true"></svg>
</main>

<div class="routebar" id="routebar" role="status" aria-live="polite"><div class="rb-body"></div></div>
<svg id="probe-svg" aria-hidden="true"><path id="probe"/></svg>

<script>
(() => {
'use strict';

/* ====================== 数据（来自你的配置） ====================== */
const COL = {gp:'#5aa9ff', pure:'#4fe0a2', res:'#ffbf5e', bak:'#b690ff', direct:'#dfe6f6', reject:'#ff5c76'};

const GROUPS = [
  {id:'gp', full:'🌐 General Proxy', emoji:'🌐', name:'General Proxy', desc:'海外网站的默认出口',

function routeOf(entry){
  if (entry === 'direct') return {hops:[], exit:'direct', node:'不走代理', color:COL.direct, last:'direct'};
  if (entry === 'reject') return {hops:[], exit:'reject', node:'阻断连接', color:COL.reject, last:'reject'};
  const hops = []; let g = entry; const seen = new Set();
  while (!seen.has(g)) {
    seen.add(g);
    const i = state[g], o = G[g].options[i];
    hops.push({g, i, o});
    if (o.to) { g = o.to; continue; }
    return {hops, exit: g === 'res' ? 'res' : 'proxy', node:o.label, color:COL[g], last:g};
  }
  return {hops, exit:'proxy', node:'', color:COL.gp, last:'gp'};
}

  clearInterval(el._timer);
  if (!fx || reduce) { el.textContent = text; return; }
  const parts = graphemes(text), total = 12; let step = 0;
  el._timer = setInterval(() => {

/* ====================== 连线几何 ====================== */
const LANE = {pure:0, gp:1, bak:2, res:3};
function bez(a, b){
  const dx = Math.max(36, (b[0] - a[0]) * .5);
  return `M${a[0]},${a[1]} C${a[0]+dx},${a[1]} ${b[0]-dx},${b[1]} ${b[0]},${b[1]}`;
}
function loop(a, b, gx){
  const dy = b[1] - a[1], dir = dy >= 0 ? 1 : -1;
  const r = Math.max(1, Math.min(16, Math.abs(dy) / 2, gx - Math.max(a[0], b[0]) - 1));
  return `M${a[0]},${a[1]} H${gx-r} Q${gx},${a[1]} ${gx},${a[1]+dir*r} V${b[1]-dir*r} Q${gx},${b[1]} ${gx-r},${b[1]} H${b[0]}`;
}
function sample(d, N){
  probe.setAttribute('d', d);
  const L = probe.getTotalLength(), pts = [];
  for (let i = 0; i < N; i++) { const p = probe.getPointAtLength(L * i / (N - 1)); pts.push([p.x, p.y]); }
  return pts;
}
function resample(pts, N){
  if (pts.length === N) return pts.map(p => [p[0], p[1]]);
  const out = [];
  for (let i = 0; i < N; i++) {
    const f = i * (pts.length - 1) / (N - 1), j = Math.floor(f), t = f - j, a = pts[j], b = pts[Math.min(j + 1, pts.length - 1)];
    out.push([a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t]);
  }
  return out;
}

const exitTop = {};
function placeExits(){
  const col = rel(exCol), head = exCol.querySelector('.col-h');
  const minTop = head.offsetTop + head.offsetHeight + 10;
  const feeder = state.gp === 2 ? 'bak' : 'gp';
  const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
  const want = {
    proxy: rel(ST[feeder].el).cy,
    res: rel(ST.res.el).cy,
    direct: avg(SITES.filter(s => s.entry === 'direct').map(s => rel(s.star).cy)),
    reject: avg(SITES.filter(s => s.entry === 'reject').map(s => rel(s.star).cy)),
  };
  const items = Object.keys(want).map(k => ({k, y:want[k], h:EX[k].el.offsetHeight || 60})).sort((a, b) => a.y - b.y);
  let prevBottom = minTop - 22;
  items.forEach(it => { const top = Math.max(it.y - col.t - it.h/2, prevBottom + 22); exitTop[it.k] = top; prevBottom = top + it.h; });
  items.forEach(it => { EX[it.k].el.style.top = exitTop[it.k] + 'px'; });
}
function exitRect(k){
  const col = rel(exCol), el = EX[k].el, t = col.t + (exitTop[k] || 0), h = el.offsetHeight;
  return {l:col.l, r:col.l + el.offsetWidth, t, b:t + h, cy:t + h/2};
}

function computeTargets(){
  const T = {};
  const card = {}; GROUPS.forEach(g => { card[g.id] = rel(ST[g.id].el); });
  if (mode === 'graph') {
    const into = {gp:[], pure:[]};
    SITES.forEach(s => { if (into[s.entry]) into[s.entry].push(s); });
    SITES.forEach(s => {
      const a = rel(s.star), p0 = [a.cx, a.cy]; let p3;
      if (into[s.entry]) {
        const c = card[s.entry], list = into[s.entry], i = list.indexOf(s), n = list.length;
        const top = c.t + 30, bot = c.b - 30;
        p3 = [c.l, n > 1 ? top + (bot - top) * i / (n - 1) : c.cy];
      } else { const e = exitRect(s.entry); p3 = [e.l, e.cy]; }
      T['s:' + s.id] = {d:bez(p0, p3), N:60, c1:COL[s.entry], c2:COL[s.entry], kind:'site'};
    });
    const gx = Math.max(...GROUPS.map(g => card[g.id].r)) + 26;
    GROUPS.forEach(g => {
      if (!isActive(g.id)) return;
      const o = g.options[state[g.id]], chip = rel(ST[g.id].chips[state[g.id]]), c = card[g.id], p0 = [c.r, chip.cy];
      if (o.to) T['o:' + g.id] = {d:loop(p0, [card[o.to].r, rel(ST[o.to].head).cy], gx + LANE[g.id]*14), N:150, c1:COL[g.id], c2:COL[o.to], kind:'out'};
      else { const e = exitRect(g.id === 'res' ? 'res' : 'proxy'); T['o:' + g.id] = {d:bez(p0, [e.l, e.cy]), N:90, c1:COL[g.id], c2:COL[g.id], kind:'out'}; }
    });
  } else {
    const gx = Math.max(...GROUPS.map(g => card[g.id].r)) + 9;
    GROUPS.forEach(g => {
      if (!isActive(g.id)) return;
      const o = g.options[state[g.id]]; if (!o.to) return;
      const chip = rel(ST[g.id].chips[state[g.id]]), c = card[g.id];
      T['o:' + g.id] = {d:loop([c.r, chip.cy], [card[o.to].r, rel(ST[o.to].head).cy], gx + LANE[g.id]*6), N:150, c1:COL[g.id], c2:COL[o.to], kind:'out'};
    });
  }
  return T;
}

function mkSeg(id){
  const gid = 'lg-' + id.replace(/[^a-z0-9]/gi, '-');
  const grad = svgEl('linearGradient', '', defs);
  grad.id = gid; grad.setAttribute('gradientUnits', 'userSpaceOnUse');
  const s0 = svgEl('stop', '', grad), s1 = svgEl('stop', '', grad); s0.setAttribute('offset', '0'); s1.setAttribute('offset', '1');
  const glow = svgEl('path', 'w-glow', gGlow), core = svgEl('path', 'w-core', gCore), flow = svgEl('path', 'w-flow', gFlow);
  glow.setAttribute('stroke', `url(#${gid})`); core.setAttribute('stroke', `url(#${gid})`);
  const pa = svgEl('circle', 'port', portsSvg), pb = svgEl('circle', 'port', portsSvg);
  pa.setAttribute('r', '3.2'); pb.setAttribute('r', '3.6');
  return {id, grad, s0, s1, glow, core, flow, pa, pb, pts:null, from:null, to:null, len:0, cum:[0], delay:0, dying:false};
}
function dropSeg(s){ [s.grad, s.glow, s.core, s.flow, s.pa, s.pb].forEach(e => e.remove()); segs.delete(s.id); }
function setPts(s, pts){
  s.pts = pts;
  let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
  const cum = [0]; let L = 0;
  for (let i = 1; i < pts.length; i++) {
    d += 'L' + pts[i][0].toFixed(1) + ',' + pts[i][1].toFixed(1);
    L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); cum.push(L);
  }
  s.cum = cum; s.len = L;
  s.glow.setAttribute('d', d); s.core.setAttribute('d', d); s.flow.setAttribute('d', d);
  const a = pts[0], b = pts[pts.length - 1];
  s.grad.setAttribute('x1', a[0]); s.grad.setAttribute('y1', a[1]); s.grad.setAttribute('x2', b[0] + .01); s.grad.setAttribute('y2', b[1] + .01);
  s.pa.setAttribute('cx', a[0]); s.pa.setAttribute('cy', a[1]);
  s.pb.setAttribute('cx', b[0]); s.pb.setAttribute('cy', b[1]);
  const vis = L > 2 ? '1' : '0';
  s.pa.style.opacity = s.kind === 'out' ? vis : '0';
  s.pb.style.opacity = vis;
}
function paintSeg(s){
  s.s0.setAttribute('stop-color', s.c1); s.s1.setAttribute('stop-color', s.c2);
  s.pa.setAttribute('fill', s.c1); s.pb.setAttribute('fill', s.c2);
}

function applyTargets(T, animate, intro){
  let si = 0, oi = 0;
  for (const id in T) {
    const t = T[id], target = sample(t.d, t.N);
    let s = segs.get(id); const fresh = !s;
    if (fresh) { s = mkSeg(id); segs.set(id, s); }
    s.kind = t.kind; s.c1 = t.c1; s.c2 = t.c2; s.dying = false; paintSeg(s);
    s.from = (fresh || !s.pts) ? target.map(() => [target[0][0], target[0][1]]) : resample(s.pts, t.N);
    s.to = target;
    s.delay = intro ? (t.kind === 'site' ? (si++) * 24 : 560 + (oi++) * 160) : 0;
    if (fresh && !animate) setPts(s, target);
    else if (fresh) setPts(s, s.from);
  }
  for (const [id, s] of segs) {
    if (T[id]) continue;
    if (!animate || !s.pts) { dropSeg(s); continue; }
    s.dying = true; s.delay = 0; s.from = s.pts.map(p => [p[0], p[1]]); s.to = s.pts.map(() => [s.pts[0][0], s.pts[0][1]]);
  }
  if (!animate || reduce) {
    for (const s of [...segs.values()]) { if (s.dying) dropSeg(s); else setPts(s, s.to); }
    tween = null; introRunning = false; sparksOn = mode === 'graph' && !reduce;
  } else {
    tween = {t0:performance.now(), dur:intro ? 1000 : 700};
    if (intro) { introRunning = true; sparksOn = false; }
  }
}
function stepTween(now){
  if (!tween) return;
  let done = true;
  for (const s of [...segs.values()]) {
    const p = clamp((now - tween.t0 - s.delay) / tween.dur, 0, 1);
    if (p < 1) done = false;
    const e = ease(p), pts = s.from.map((a, i) => [a[0] + (s.to[i][0] - a[0]) * e, a[1] + (s.to[i][1] - a[1]) * e]);
    setPts(s, pts);
    if (p >= 1 && s.dying) dropSeg(s);
  }
  if (done) {
    tween = null;
    if (introRunning) { introRunning = false; sparksOn = mode === 'graph' && !reduce; seedSparks(); }
  }
}

let W = 0, H = 0, DPR = 1;
function sizeLayers(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w === W && h === H) return;
  W = w; H = h;
  [wires, portsSvg].forEach(s => { s.setAttribute('width', w); s.setAttribute('height', h); s.style.width = w + 'px'; s.style.height = h + 'px'; });
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  cvs.width = Math.round(w * DPR); cvs.height = Math.round(h * DPR);
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
}
function relayout(animate, intro){
  sizeLayers();
  if (mode === 'graph') placeExits();
  applyTargets(computeTargets(), animate, intro);
  refreshFocus();
}

/* ====================== 光点粒子 ====================== */
const sprites = {};
function sprite(c){
  if (sprites[c]) return sprites[c];
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const x = s.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.16, hexA(c, 1)); g.addColorStop(.42, hexA(c, .32)); g.addColorStop(1, hexA(c, 0));
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return (sprites[c] = s);
}
let sparks = [];
function seedSparks(){
  sparks = [];
  SITES.forEach((s, i) => {
    for (let k = 0; k < 2; k++) sparks.push({site:s, f:-(Math.random()*.7) - k*.5 - (i%5)*.03, v:95 + Math.random()*40, size:18, burst:false});
  });
}
function burst(list){
  if (reduce) return;
  list.forEach(s => { for (let k = 0; k < 3; k++) sparks.push({site:s, f:-k*.035, v:380, size:22, burst:true}); });
}
function chainInfo(chain){
  const parts = []; let total = 0, prev = null;
  for (const id of chain) {
    const s = segs.get(id); if (!s || !s.pts) continue;
    if (prev) { const a = prev.pts[prev.pts.length - 1], b = s.pts[0], g = Math.hypot(b[0]-a[0], b[1]-a[1]); parts.push({gap:true, a, b, len:g}); total += g; }
    parts.push({gap:false, s, len:s.len}); total += s.len; prev = s;
  }
  return {parts, total};
}
function pointOn(info, d){
  let acc = 0;
  for (const p of info.parts) {
    if (d <= acc + p.len || p === info.parts[info.parts.length - 1]) {
      const t = p.len ? clamp((d - acc) / p.len, 0, 1) : 0;
      if (p.gap) return {x:p.a[0] + (p.b[0]-p.a[0])*t, y:p.a[1] + (p.b[1]-p.a[1])*t, c:null, hidden:true};
      const s = p.s, cum = s.cum, target = t * s.len;
      let lo = 0, hi = cum.length - 1;
      while (lo < hi - 1) { const m = (lo + hi) >> 1; if (cum[m] < target) lo = m; else hi = m; }
      const span = cum[hi] - cum[lo] || 1, u = (target - cum[lo]) / span, A = s.pts[lo], B = s.pts[hi];
      return {x:A[0] + (B[0]-A[0])*u, y:A[1] + (B[1]-A[1])*u, c: t < .5 ? s.c1 : s.c2, hidden:false};
    }
    acc += p.len;
  }
  return null;
}
let stageVisible = true, last = performance.now(), cleared = false;
function drawSparks(dt){
  if (!sparksOn || !stageVisible) { if (!cleared) { ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, cvs.width, cvs.height); cleared = true; } return; }
  cleared = false;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const infos = new Map();
  const getInfo = s => { let i = infos.get(s.id); if (!i) { i = chainInfo(s.chain); infos.set(s.id, i); } return i; };
  for (let n = sparks.length - 1; n >= 0; n--) {
    const p = sparks[n], info = getInfo(p.site);
    if (!info.total) continue;
    p.f += p.v * dt / info.total;
    if (p.f > 1) { if (p.burst) { sparks.splice(n, 1); continue; } p.f -= 1 + Math.random()*.2; }
    if (p.f < 0) continue;
    const d = p.f * info.total, head = pointOn(info, d); if (!head) continue;
    let alpha = clamp(Math.min(d / 50, (info.total - d) / 50), 0, 1);
    let size = p.size;
    if (p.site.entry === 'reject' && p.f > .9) { size *= 1 + (p.f - .9) * 16; alpha *= 1 - (p.f - .9) * 9; }
    if (focusSet && !focusSet.has(p.site.id)) alpha *= .1;
    if (head.hidden) alpha *= .55;
    if (p.burst) alpha = Math.min(1, alpha * 1.4);
    if (alpha <= .01) continue;
    const c = head.c || p.site.route.color;
    const sp = sprite(c);
    ctx.globalAlpha = alpha;
    ctx.drawImage(sp, head.x - size/2, head.y - size/2, size, size);
    for (let k = 1; k <= 4; k++) {
      const q = pointOn(info, d - k * (p.burst ? 9 : 6)); if (!q) break;
      const sz = size * (1 - k * .17);
      ctx.globalAlpha = alpha * (.5 - k * .1) * (q.hidden ? .55 : 1);
      ctx.drawImage(sprite(q.c || c), q.x - sz/2, q.y - sz/2, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  stepTween(now);
  if (mode === 'graph') drawSparks(dt);
  requestAnimationFrame(frame);
}
if ('IntersectionObserver' in window) new IntersectionObserver(es => { stageVisible = es[0].isIntersecting; }).observe(stage);

/* ====================== 聚焦与路线条 ====================== */
let focus = null, pinned = null, focusSet = null, toastMsg = null, toastTimer = 0;
function focusSites(f){
  if (!f) return null;
  if (f.kind === 'site') return [f.site];
  if (f.kind === 'group') return SITES.filter(s => s.route.hops.some(h => h.g === f.g));
  if (f.kind === 'exit') return SITES.filter(s => s.route.exit === f.x);
  return null;
}
function setFocus(f){ focus = f; if (f && toastMsg) { toastMsg = null; clearTimeout(toastTimer); } refreshFocus(); }
function togglePin(site){
  if (pinned === site) { pinned = null; setFocus(null); }
  else { pinned = site; setFocus({kind:'site', site}); }
}
function refreshFocus(){
  const list = focusSites(focus);
  focusSet = list ? new Set(list.map(s => s.id)) : null;
  stage.classList.toggle('focusing', !!focusSet);
  SITES.forEach(s => s.el.classList.toggle('hot', !!focusSet && focusSet.has(s.id)));
  const hot = new Set();
  if (focusSet) SITES.forEach(s => { if (focusSet.has(s.id)) s.chain.forEach(id => hot.add(id)); });
  segs.forEach((sg, id) => {
    const h = !!focusSet && hot.has(id), dm = !!focusSet && !h;
    [sg.glow, sg.core, sg.flow].forEach(p => { p.classList.toggle('hot', h); p.classList.toggle('dim', dm); });
    sg.pa.classList.toggle('dim', dm); sg.pb.classList.toggle('dim', dm);
  });
  GROUPS.forEach(g => ST[g.id].el.classList.toggle('lit', !!list && list.some(s => s.route.hops.some(h => h.g === g.id))));
  Object.keys(EX).forEach(k => EX[k].el.classList.toggle('lit', !!list && list.some(s => s.route.exit === k)));
  renderRoutebar();
}
function chainHTML(s){
  const r = s.route, nodes = [{t:`${s.icon} ${s.name}`, c:COL[s.entry]}];
  r.hops.forEach((h, idx) => {
    const isLast = idx === r.hops.length - 1;
    nodes.push({t:G[h.g].full, c:COL[h.g], note: isLast ? '' : h.o.label});
  });
  nodes.push({t:r.node, c:r.color, end:true});
  let html = '';
  nodes.forEach((n, i) => {
    if (i) html += `<span class="rb-link" style="--a:${nodes[i-1].c};--b:${n.c}"></span>`;
    html += `<span class="rb-node${n.end ? ' end' : ''}" style="--c:${n.c}">${esc(n.t)}${n.note ? `<small>${esc(n.note)}</small>` : ''}</span>`;
  });
  return html;
}
function renderRoutebar(){
  let html = '', closable = !!pinned;
  if (toastMsg) html = `<p class="rb-idle">${esc(toastMsg)}</p>`;
  else if (!focus) html = `<p class="rb-idle"><span class="only-mouse">把鼠标移到网站上就能看到它的完整路线，点一下可以固定</span><span class="only-touch">点一下任意网站，看看它的完整路线</span></p>`;
  else if (focus.kind === 'site') {
    const s = focus.site;
    html = `<p class="rb-line"><b>${esc(s.name)}</b>　${esc(s.sub)}</p><div class="rb-chain">${chainHTML(s)}</div>`;
  } else {
    const list = focusSites(focus);
    const head = focus.kind === 'group'
      ? (list.length ? `共 <b>${list.length}</b> 个网站经过 <b>${esc(G[focus.g].full)}</b>` : `目前没有网站经过 <b>${esc(G[focus.g].full)}</b>`)
      : `共 <b>${list.length}</b> 个网站从 <b>${esc(EX[focus.x].title._target || '')}</b> 出去`;
    html = `<p class="rb-line">${head}</p>${list.length ? `<p class="rb-list">${list.map(s => esc(s.name)).join('、')}</p>` : ''}`;
  }
  rbBody.innerHTML = html;
  let btn = rb.querySelector('.rb-close');
  if (closable && !toastMsg) {
    if (!btn) { btn = document.createElement('button'); btn.type = 'button'; btn.className = 'rb-close'; btn.setAttribute('aria-label', '取消选中'); btn.textContent = '×'; btn.addEventListener('click', () => { pinned = null; setFocus(null); }); rb.appendChild(btn); }
  } else if (btn) btn.remove();
}
function toast(msg){
  toastMsg = msg; renderRoutebar();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastMsg = null; renderRoutebar(); }, 2600);
}
document.addEventListener('click', e => {
  if (!pinned) return;
  if (e.target.closest('.site, .station, .exit, .routebar')) return;
  pinned = null; setFocus(null);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (pinned || focus)) { pinned = null; setFocus(null); } });

/* ====================== 星空背景 ====================== */
function drawSky(){
  const c = $('#sky'), d = Math.min(window.devicePixelRatio || 1, 2), w = innerWidth, h = Math.max(innerHeight, screen.height || 0);
  c.width = Math.round(w * d); c.height = Math.round(h * d);
  const x = c.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h);
  let seed = 20240917; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const n = Math.round(w * h / 4600), tints = ['#9cc8ff', '#c9b6ff', '#a6f0d2', '#ffe1a8'];
  for (let i = 0; i < n; i++) {
    const r = Math.pow(rnd(), 3) * 1.25 + .3;
    x.globalAlpha = .18 + rnd() * .6;
    x.fillStyle = rnd() < .14 ? tints[(rnd() * tints.length) | 0] : '#e9ecff';
    x.beginPath(); x.arc(rnd() * w, rnd() * h, r, 0, 6.2832); x.fill();
  }
}

/* ====================== 启动 ====================== */
function setMode(){
  const m = mqGraph.matches ? 'graph' : 'lanes';
  if (m === mode && segs.size) return;
  mode = m;
  for (const s of [...segs.values()]) dropSeg(s);
  W = H = 0;
  sparksOn = false;
  if (m === 'graph' && !reduce) seedSparks();
  relayout(!reduce, !reduce);
}
let rq = 0;
function queueRelayout(){
  cancelAnimationFrame(rq);
  rq = requestAnimationFrame(() => { W = H = 0; relayout(!!tween); });
}
mqGraph.addEventListener ? mqGraph.addEventListener('change', setMode) : mqGraph.addListener(setMode);
const onReduce = () => { reduce = mqReduce.matches; if (reduce) { sparksOn = false; } else if (mode === 'graph') { sparksOn = true; seedSparks(); } };
mqReduce.addEventListener ? mqReduce.addEventListener('change', onReduce) : mqReduce.addListener(onReduce);
let skyT = 0;
addEventListener('resize', () => { clearTimeout(skyT); skyT = setTimeout(drawSky, 180); });

drawSky();
update(false);
renderRoutebar();
const start = () => {
  if (start.done) return; start.done = true;
  seedSparks();
  relayout(!reduce, !reduce);
  if ('ResizeObserver' in window) { const ro = new ResizeObserver(queueRelayout); ro.observe(stage); ro.observe(stCol); ro.observe(sitesCol); }
  else addEventListener('resize', queueRelayout);
  requestAnimationFrame(t => { last = t; frame(t); });
};
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 900))]) : Promise.resolve()).then(start);
if (document.fonts) document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', queueRelayout);
})();
</script>
